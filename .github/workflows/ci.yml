# Lints the workflows and scripts, runs the script tests, and runs the release workflow end to end
# (dry run, no GitHub Release) on test-fixtures/hello-craft, then installs and runs what it made on
# every platform.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: actionlint, shellcheck, zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint v1.7.12, built from source; the Go checksum database verifies the module.
      - name: actionlint
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -version
          # With the runner's ShellCheck on PATH, actionlint also lints every run: block.
          "$RUNNER_TEMP/bin/actionlint" -color

      - name: shellcheck the scripts
        run: |
          set -euo pipefail
          shellcheck --version
          find actions scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=style

      - name: Check the PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 -Path actions) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary=:all: -r .github/requirements/zizmor.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --version
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format plain .

  script-tests:
    name: Script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: unittest
        run: python3 -m unittest discover -s tests -v

  version:
    name: Test version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "version=0.1.0-ci.$RUN_NUMBER.$RUN_ATTEMPT" >>"$GITHUB_OUTPUT"

  self-test:
    name: Release workflow (dry run)
    needs: version
    # The reusable workflow's jobs ask for these; on a dry run nothing is written to the repository
    # except the build provenance attestation.
    permissions:
      contents: write # asked for by the release job, which a dry run skips
      id-token: write # the workflow reads its own commit from the OIDC token; provenance signing
      attestations: write # build provenance of the test assets
    uses: ./.github/workflows/release-rust-app.yml
    with:
      app-id: hello-craft
      display-name: HelloCraft
      bundle-id: app.freedev.ainz.ks.HelloCraft
      version: ${{ needs.version.outputs.version }}
      package: hello-craft
      bin: hello-craft
      features: ""
      publish: false
      prerelease: false
      dry-run: true
      working-directory: test-fixtures/hello-craft

  verify-linux:
    name: Install and run (Linux ${{ matrix.arch }})
    needs: [version, self-test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.self-test.outputs.assets-artifact }}
          path: assets
      - name: Checksums, names, feed, SBOM
        run: |
          set -euo pipefail
          (cd assets && sha256sum -c SHA256SUMS.txt)
          python3 scripts/asset_names.py check assets --app-id hello-craft --version "$VERSION" --expect-full
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          feed = json.loads(Path("assets/update-feed.json").read_text())
          v = os.environ["VERSION"]
          assert feed["version"] == v and feed["tag"] == f"v{v}" and feed["id"] == "hello-craft", feed
          assert sorted(feed["platforms"]) == ["linux-aarch64", "linux-x86_64", "macos-universal", "windows-x64"], feed["platforms"]
          for entries in feed["platforms"].values():
              for e in entries:
                  data = Path("assets", e["name"]).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == e["sha256"] and len(data) == e["size"], e
          print("update-feed.json is consistent")
          PY
          jq -e '.bomFormat == "CycloneDX" and (.metadata.component.name == "hello-craft")' assets/hello-craft-*-sbom.cdx.json
      - name: tar.gz
        run: |
          set -euo pipefail
          base="hello-craft-$VERSION-linux-$ARCH"
          mkdir t && tar -xzf "assets/$base.tar.gz" -C t
          find t -type f | sort
          test -f "t/$base/share/applications/app.freedev.ainz.ks.HelloCraft.desktop"
          test -f "t/$base/share/icons/hicolor/512x512/apps/app.freedev.ainz.ks.HelloCraft.png"
          out="$("t/$base/bin/hello-craft" --version)"
          echo "$out"
          test "$out" = "hello-craft $VERSION"
      - name: AppImage
        run: |
          set -euo pipefail
          app="assets/hello-craft-$VERSION-linux-$ARCH.AppImage"
          test -x "$app"
          test -s "$app.zsync"
          out="$(APPIMAGE_EXTRACT_AND_RUN=1 "$app" --version)"
          echo "$out"
          test "$out" = "hello-craft $VERSION"
      - name: deb
        run: |
          set -euo pipefail
          deb="assets/hello-craft-$VERSION-linux-$ARCH.deb"
          dpkg-deb --info "$deb"
          sudo apt-get install -y -qq "./$deb"
          test "$(hello-craft --version)" = "hello-craft $VERSION"
          test -f /usr/share/applications/app.freedev.ainz.ks.HelloCraft.desktop
          sudo apt-get remove -y -qq hello-craft
      - name: rpm
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends rpm
          rpm -qip "assets/hello-craft-$VERSION-linux-$ARCH.rpm"
          rpm -qlp "assets/hello-craft-$VERSION-linux-$ARCH.rpm" | grep -x /usr/bin/hello-craft

  verify-macos:
    name: Install and run (macOS)
    needs: [version, self-test]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.self-test.outputs.assets-artifact }}
          path: assets
      - name: Mount the DMG and run the app
        run: |
          set -euo pipefail
          dmg="assets/hello-craft-$VERSION-macos-universal.dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app="$mnt/HelloCraft.app"
          ls -la "$mnt"
          test -L "$mnt/Applications"
          plutil -p "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = app.freedev.ainz.ks.HelloCraft
          test "$(/usr/libexec/PlistBuddy -c 'Print :HelloCraftVersion' "$app/Contents/Info.plist")" = "$VERSION"
          lipo -archs "$app/Contents/MacOS/hello-craft"
          codesign --verify --strict --verbose=2 "$app"
          test -f "$app/Contents/Resources/AppIcon.icns"
          out="$("$app/Contents/MacOS/hello-craft" --version)"
          echo "$out"
          test "$out" = "hello-craft $VERSION"
          arch -x86_64 "$app/Contents/MacOS/hello-craft" --version
          hdiutil detach "$mnt"

  verify-windows:
    name: Install and run (Windows)
    needs: [version, self-test]
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.self-test.outputs.assets-artifact }}
          path: assets
      - name: Portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive "assets/hello-craft-$env:VERSION-windows-x64-portable.zip" -DestinationPath portable
          Get-ChildItem portable | Format-Table Name, Length
          $out = & .\portable\hello-craft.exe --version
          Write-Host $out
          if ($out -ne "hello-craft $env:VERSION") { throw "unexpected output: $out" }
      - name: MSI install, run, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "assets/hello-craft-$env:VERSION-windows-x64.msi").Path
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "msiexec /i exited with $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'HelloCraft\hello-craft.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing" }
          $out = & $exe --version
          Write-Host $out
          if ($out -ne "hello-craft $env:VERSION") { throw "unexpected output: $out" }
          $entry = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.PSObject.Properties['DisplayName'] -and $_.DisplayName -eq 'HelloCraft' }
          if (-not $entry) { throw 'no uninstall entry named HelloCraft' }
          $entry | Format-List DisplayName, DisplayVersion, Publisher, InstallLocation
          if (-not $entry.InstallLocation) { throw 'the uninstall entry has no InstallLocation' }
          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\HelloCraft.lnk'
          if (-not (Test-Path $lnk)) { throw "$lnk is missing" }
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited with $($p.ExitCode)" }
          if (Test-Path $exe) { throw "$exe is still there after uninstalling" }
