name: bootstrap-tmp
on: push
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for spec in AppImage/appimagetool:1.9.1 AppImage/type2-runtime:20251108 jedisct1/minisign:0.12 goreleaser/nfpm:v2.47.0 CycloneDX/cyclonedx-rust-cargo:cargo-cyclonedx-0.5.9 CycloneDX/cyclonedx-rust-cargo:cargo-cyclonedx-0.5.7; do
            repo="${spec%%:*}"; tag="${spec#*:}"
            echo "=== $repo $tag"
            gh api "repos/$repo/releases/tags/$tag" --jq '.published_at, (.assets[] | "\(.name) \(.digest) \(.size)")' || true
          done
          echo "=== latest releases"
          for repo in AppImage/appimagetool AppImage/type2-runtime CycloneDX/cyclonedx-rust-cargo; do gh api "repos/$repo/releases?per_page=5" --jq '.[] | "\(.tag_name) \(.published_at) \(.assets|length)"'; done
          ls /usr/share/dotnet/sdk || true
          python3 --version; jq --version; zsyncmake -V || true; which convert magick || true
  win:
    runs-on: windows-2025
    steps:
      - shell: bash
        run: |
          python --version; jq --version || true; dotnet --list-sdks; ls "/c/Program Files (x86)/Windows Kits/10/bin" || true; which magick || true; pwsh --version
  arm:
    runs-on: ubuntu-22.04-arm
    steps:
      - run: |
          python3 --version; jq --version; which convert rustup cargo || true; uname -m
  mac:
    runs-on: macos-15
    steps:
      - run: |
          python3 --version; jq --version; rustup --version; xcrun --find notarytool; sw_vers
