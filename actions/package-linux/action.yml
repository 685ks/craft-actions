name: Package for Linux
description: >
  Packs a Linux binary as <id>-<version>-linux-<arch>.AppImage (+ .AppImage.zsync), .tar.gz, .deb
  and .rpm. appimagetool, the AppImage runtime and nfpm are downloaded at pinned versions and
  checked against pinned SHA-256 sums.
inputs:
  app-id: { description: "Release asset stem, e.g. photocraft.", required: true }
  display-name: { description: "Human-readable name, e.g. PhotoCraft.", required: true }
  bundle-id: { description: "Reverse-DNS id: desktop file and icon name.", required: true }
  version: { description: "Release version (semver, no leading v).", required: true }
  bin: { description: "Binary name.", required: true }
  binary: { description: "Path of the built binary.", required: true }
  arch: { description: "x86_64 or aarch64 (must match the runner).", required: true }
  description: { description: "One-line description.", required: true }
  categories: { description: "freedesktop categories, ';'-terminated (Graphics;Utility;).", required: true }
  icon-png: { description: "Square PNG icon, relative to working-directory.", required: true }
  license: { description: "SPDX license expression.", required: true }
  homepage: { description: "Project URL.", required: true }
  maintainer: { description: "Package maintainer, 'Name <email>'.", required: true }
  repository: { description: "owner/repo the release is published on (AppImage update info).", required: true }
  working-directory: { description: "The app's directory (license files and icon are read from it).", required: false, default: "." }
  out-dir: { description: "Where the packages are written.", required: true }
runs:
  using: composite
  steps:
    - name: Install packaging tools
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: bash "$GITHUB_ACTION_PATH/install-tools.sh"
    - name: Package
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APP_ID: ${{ inputs.app-id }}
        DISPLAY_NAME: ${{ inputs.display-name }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        VERSION: ${{ inputs.version }}
        BIN: ${{ inputs.bin }}
        BINARY: ${{ inputs.binary }}
        ARCH: ${{ inputs.arch }}
        DESCRIPTION: ${{ inputs.description }}
        CATEGORIES: ${{ inputs.categories }}
        ICON_PNG: ${{ inputs.icon-png }}
        LICENSE: ${{ inputs.license }}
        HOMEPAGE: ${{ inputs.homepage }}
        MAINTAINER: ${{ inputs.maintainer }}
        REPOSITORY: ${{ inputs.repository }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: bash "$GITHUB_ACTION_PATH/package-linux.sh"
