name: Package for macOS
description: >
  Joins an Apple silicon and an Intel binary with lipo, wraps the result in <display-name>.app
  (Info.plist from the inputs, icon from icon-icns or made from icon-png) and packs it as
  <id>-<version>-macos-universal.dmg. Signs with a Developer ID and notarizes when the secrets are
  given; otherwise signs ad hoc.
inputs:
  app-id: { description: "Release asset stem.", required: true }
  display-name: { description: "Bundle name: <display-name>.app.", required: true }
  bundle-id: { description: "CFBundleIdentifier.", required: true }
  version: { description: "Release version.", required: true }
  numeric-version: { description: "major.minor.patch of the version.", required: true }
  bin: { description: "Binary name (CFBundleExecutable).", required: true }
  binary-arm64: { description: "Path of the aarch64-apple-darwin binary.", required: true }
  binary-x86_64: { description: "Path of the x86_64-apple-darwin binary.", required: true }
  icon-png: { description: "Square PNG icon, relative to working-directory.", required: true }
  icon-icns: { description: "Optional .icns, relative to working-directory.", required: false, default: "" }
  minimum-system-version: { description: "LSMinimumSystemVersion.", required: false, default: "11.0" }
  working-directory: { description: "The app's directory.", required: false, default: "." }
  out-dir: { description: "Where the DMG is written.", required: true }
  certificate: { description: "Base64 Developer ID Application .p12 (MACOS_CERTIFICATE).", required: false, default: "" }
  certificate-password: { description: "Its password (MACOS_CERTIFICATE_PASSWORD).", required: false, default: "" }
  apple-id: { description: "Apple ID for notarization (APPLE_ID).", required: false, default: "" }
  apple-team-id: { description: "Team ID (APPLE_TEAM_ID).", required: false, default: "" }
  apple-app-password: { description: "App-specific password (APPLE_APP_PASSWORD).", required: false, default: "" }
runs:
  using: composite
  steps:
    - name: Bundle, sign and pack
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APP_ID: ${{ inputs.app-id }}
        DISPLAY_NAME: ${{ inputs.display-name }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        VERSION: ${{ inputs.version }}
        NUMERIC_VERSION: ${{ inputs.numeric-version }}
        BIN: ${{ inputs.bin }}
        BINARY_ARM64: ${{ inputs.binary-arm64 }}
        BINARY_X86_64: ${{ inputs.binary-x86_64 }}
        ICON_PNG: ${{ inputs.icon-png }}
        ICON_ICNS: ${{ inputs.icon-icns }}
        MIN_SYSTEM: ${{ inputs.minimum-system-version }}
        OUT_DIR: ${{ inputs.out-dir }}
        MACOS_CERTIFICATE: ${{ inputs.certificate }}
        MACOS_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        APPLE_APP_PASSWORD: ${{ inputs.apple-app-password }}
      run: bash "$GITHUB_ACTION_PATH/package-macos.sh"
